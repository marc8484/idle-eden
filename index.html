<!DOCTYPE html><html><head><meta charset="utf-8"><title>Idle Eden V3</title><style>body{background:#1b1b1b;color:#fff;font-family:Arial;max-width:1200px;margin:auto;padding:20px} .panel{background:#2d2d2d;padding:12px;margin:10px 0;border-radius:8px} button{margin:2px;padding:6px} .common{color:#fff}.uncommon{color:#6f6}.rare{color:#6cf}.epic{color:#c6f}.legendary{color:orange} #log{height:220px;overflow:auto;background:#000;padding:8px}</style></head><body><h1>Idle Eden V3</h1><div class="panel"><h3>Create Character</h3><input id="charName" placeholder="Character Name"><select id="realm"><option>Hibernia</option><option>Midgard</option><option>Albion</option></select><select id="clazz"><option>Chanter</option><option>Hero</option><option>Druid</option><option>Berserker</option><option>Healer</option><option>Mercenary</option></select><button onclick="createCharacter()">Create</button></div><div class="panel"><h3>Characters</h3><div id="characterList"></div></div><div id="game" style="display:none"><div class="panel"><h2 id="header"></h2><div>Level: <span id="level"></span></div><div>XP: <span id="xp"></span></div><div>Gold: <span id="gold"></span></div><div>RP: <span id="rp"></span></div><div>RR: <span id="rr"></span></div><div>Power: <span id="power"></span></div></div><div class="panel"><h3>Equipment</h3><div>Weapon: <span id="weapon"></span></div></div><div class="panel"><h3>Inventory</h3><div id="inv"></div></div><div class="panel"><h3>Battle Log</h3><div id="log"></div></div></div><script>let chars=JSON.parse(localStorage.getItem('idleEdenV3'))||[];let current=null;function save(){localStorage.setItem('idleEdenV3',JSON.stringify(chars));}function createCharacter(){let n=document.getElementById('charName').value;if(!n)return;chars.push({id:Date.now(),name:n,realm:realm.value,clazz:clazz.value,level:1,xp:0,gold:0,rp:0,power:1,inventory:[],equipment:{weapon:null},last:Date.now()});save();renderChars();}function renderChars(){characterList.innerHTML='';chars.forEach(c=>{characterList.innerHTML+=`<div><b>${c.name}</b> Lv${c.level} RR${Math.floor(c.rp/1000)+1} <button onclick="play(${c.id})">Play</button> <button onclick="delc(${c.id})">Delete</button></div>`;});}function delc(id){chars=chars.filter(x=>x.id!==id);save();renderChars();}function play(id){current=chars.find(x=>x.id===id);offline();game.style.display='block';update();}function offline(){let s=Math.floor((Date.now()-current.last)/1000);current.xp+=Math.floor(s/5);current.gold+=Math.floor(s/10);current.rp+=Math.floor(s/20);current.last=Date.now();save();}function log(t){document.getElementById('log').innerHTML=t+'<br>'+document.getElementById('log').innerHTML;}function req(){return current.level*100;}function update(){if(!current)return;header.innerText=current.name+' - '+current.realm+' '+current.clazz;level.innerText=current.level;xp.innerText=current.xp+'/'+req();gold.innerText=current.gold;rp.innerText=current.rp;rr.innerText=Math.floor(current.rp/1000)+1;power.innerText=current.power;weapon.innerText=current.equipment.weapon?current.equipment.weapon.name+' (+'+current.equipment.weapon.power+')':'None';inv.innerHTML='';current.inventory.forEach((it,i)=>{inv.innerHTML+=`<div class="${it.rarity}">${it.rarity.toUpperCase()} ${it.name} +${it.power} <button onclick="sell(${i})">Sell</button></div>`});save();}function sell(i){current.gold+=current.inventory[i].value;current.inventory.splice(i,1);update();}function loot(){let r=Math.random()*100,rar='common',p=1,val=10;if(r>99){rar='legendary';p=25;val=5000}else if(r>95){rar='epic';p=15;val=1000}else if(r>85){rar='rare';p=10;val=250}else if(r>60){rar='uncommon';p=5;val=50}let names=['Frontier Blade','Celtic Hammer','Hero Sword','Relic Staff'];let item={name:names[Math.floor(Math.random()*names.length)],rarity:rar,power:p,value:val};current.inventory.push(item);if(!current.equipment.weapon||item.power>current.equipment.weapon.power){current.equipment.weapon=item;current.power=item.power;log('Auto-equipped '+item.name);}log('Loot: '+rar+' '+item.name);}function tick(){if(!current)return;current.xp+=5+current.power;current.gold+=2;if(current.xp>=req()){current.xp=0;current.level++;log('Level Up '+current.level);}if(Math.random()>.4){let gain=Math.floor(Math.random()*50)+20+current.power;current.rp+=gain;}if(Math.random()>.92)loot();update();}renderChars();setInterval(tick,5000);window.addEventListener('beforeunload',()=>{if(current){current.last=Date.now();save();}});</script></body></html>
