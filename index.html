<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Idle Eden v2</title>

<style>
body{
    background:#1b1b1b;
    color:white;
    font-family:Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.panel{
    background:#2d2d2d;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

button{
    padding:8px;
    margin:3px;
}

.character-card{
    background:#3a3a3a;
    padding:10px;
    margin:5px;
}

.log{
    background:black;
    height:220px;
    overflow-y:auto;
    padding:10px;
}

.inventory-item{
    padding:4px;
    border-bottom:1px solid #555;
}

.legendary{color:orange;}
.epic{color:violet;}
.rare{color:#63b3ff;}
.uncommon{color:#5eff5e;}
.common{color:white;}
</style>
</head>

<body>

<h1>Idle Eden V2</h1>

<div class="panel">

<h2>Create Character</h2>

<input id="charName" placeholder="Character Name">

<select id="realm">
<option>Hibernia</option>
<option>Albion</option>
<option>Midgard</option>
</select>

<select id="clazz">
<option>Chanter</option>
<option>Hero</option>
<option>Druid</option>
<option>Berserker</option>
<option>Healer</option>
<option>Mercenary</option>
</select>

<button onclick="createCharacter()">
Create
</button>

</div>

<div class="panel">

<h2>Characters</h2>

<div id="characterList"></div>

</div>

<div id="gamePanel" style="display:none">

<div class="panel">
<h2 id="playerHeader"></h2>

Level: <span id="level"></span><br>
XP: <span id="xp"></span><br>
Gold: <span id="gold"></span><br>
RP: <span id="rp"></span><br>
RR: <span id="rr"></span><br>

</div>

<div class="panel">

<h3>Equipment</h3>

Weapon:
<span id="weapon"></span>

</div>

<div class="panel">

<h3>Inventory</h3>

<div id="inventory"></div>

</div>

<div class="panel">

<h3>Battle Log</h3>

<div class="log" id="log"></div>

</div>

</div>

<script>

let characters =
JSON.parse(
localStorage.getItem("idleEdenCharacters")
) || [];

let currentCharacter = null;

function saveCharacters() {

localStorage.setItem(
"idleEdenCharacters",
JSON.stringify(characters)
);

}

function createCharacter(){

const name =
document.getElementById("charName").value;

if(!name) return;

const c = {

id: Date.now(),

name:name,

realm:
document.getElementById("realm").value,

clazz:
document.getElementById("clazz").value,

level:1,
xp:0,
gold:0,
rp:0,

inventory:[],

equipment:{
weapon:null
},

lastLogin:Date.now()

};

characters.push(c);

saveCharacters();

renderCharacters();

}

function renderCharacters(){

const container =
document.getElementById("characterList");

container.innerHTML="";

characters.forEach(c=>{

const div =
document.createElement("div");

div.className="character-card";

div.innerHTML=`

<b>${c.name}</b>
(${c.realm} ${c.clazz})

Level ${c.level}
RR ${Math.floor(c.rp/1000)+1}

<br>

<button onclick="selectCharacter(${c.id})">
Play
</button>

<button onclick="deleteCharacter(${c.id})">
Delete
</button>
`;

container.appendChild(div);

});

}

function deleteCharacter(id){

characters =
characters.filter(x=>x.id!==id);

saveCharacters();

renderCharacters();

}

function selectCharacter(id){

currentCharacter =
characters.find(x=>x.id===id);

processOfflineRewards();

document.getElementById(
"gamePanel"
).style.display="block";

updateUI();

}

function processOfflineRewards(){

let now = Date.now();

let diff =
(now-currentCharacter.lastLogin)
/ 1000;

let xp = Math.floor(diff/5);

let gold = Math.floor(diff/10);

let rp = Math.floor(diff/20);

currentCharacter.xp += xp;
currentCharacter.gold += gold;
currentCharacter.rp += rp;

if(xp > 0){

addLog(
`Offline rewards:
+${xp} XP
+${gold} Gold
+${rp} RP`
);

}

currentCharacter.lastLogin = now;

saveCharacters();

}

function addLog(msg){

const log =
document.getElementById("log");

log.innerHTML =
new Date().toLocaleTimeString()
+" - "+msg+"<br>"
+log.innerHTML;

}

function levelRequirement(){

return currentCharacter.level * 100;

}

function updateUI(){

if(!currentCharacter) return;

document.getElementById(
"playerHeader"
).innerText =
`${currentCharacter.name}
(${currentCharacter.clazz})`;

document.getElementById("level")
.innerText=currentCharacter.level;

document.getElementById("xp")
.innerText=
currentCharacter.xp;

document.getElementById("gold")
.innerText=
currentCharacter.gold;

document.getElementById("rp")
.innerText=
currentCharacter.rp;

document.getElementById("rr")
.innerText=
Math.floor(
currentCharacter.rp/1000
)+1;

document.getElementById("weapon")
.innerText=
currentCharacter
.equipment.weapon
|| "None";

renderInventory();

saveCharacters();

}

function renderInventory(){

const inv =
document.getElementById(
"inventory"
);

inv.innerHTML="";

currentCharacter.inventory
.forEach(item=>{

const div=
document.createElement("div");

div.className=
"inventory-item "
+ item.rarity;

div.innerText =
item.rarity.toUpperCase()+
" "+
item.name;

inv.appendChild(div);

});

}

function rollLoot(){

const roll =
Math.random()*100;

let rarity="common";

if(roll>99)
rarity="legendary";

else if(roll>95)
rarity="epic";

else if(roll>85)
rarity="rare";

else if(roll>60)
rarity="uncommon";

const item={

name:"Frontier Weapon",

rarity:rarity

};

currentCharacter.inventory
.push(item);

if(
!currentCharacter
.equipment.weapon
||
rarity==="legendary"
){

currentCharacter
.equipment.weapon=
rarity.toUpperCase()+
" Frontier Weapon";

}

addLog(
"Loot Found: "
+ rarity.toUpperCase()
);

}

function gameTick(){

if(!currentCharacter)
return;

currentCharacter.xp += 5;

currentCharacter.gold += 2;

if(
currentCharacter.xp
>= levelRequirement()
){

currentCharacter.xp=0;

currentCharacter.level++;

addLog(
"Level Up! "
+currentCharacter.level
);

}

if(Math.random()>0.5){

let rp=
Math.floor(
Math.random()*50
)+20;

currentCharacter.rp += rp;

addLog(
"Victory! +"
+rp+" RP"
);

}

if(Math.random()>0.92){

rollLoot();

}

updateUI();

}

renderCharacters();

setInterval(
gameTick,
5000
);

setInterval(
saveCharacters,
5000
);

window.addEventListener(
"beforeunload",
()=>{

if(currentCharacter){

currentCharacter.lastLogin=
Date.now();

saveCharacters();

}

}
);

</script>

</body>
</html>
