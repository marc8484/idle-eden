<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Idle Eden Prototype</title>

<style>
body{
    background:#1b1b1b;
    color:white;
    font-family:Arial;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.panel{
    background:#2d2d2d;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

h1{
    color:#88ff88;
}

.log{
    height:250px;
    overflow-y:auto;
    background:black;
    padding:10px;
}

.stat{
    color:#ffd966;
}
</style>
</head>

<body>

<h1>Idle Eden</h1>

<div class="panel">
    <input id="name" placeholder="Character Name" value="Warhymn">

    <select id="realm">
        <option>Hibernia</option>
        <option>Midgard</option>
        <option>Albion</option>
    </select>

    <select id="class">
        <option>Chanter</option>
        <option>Druid</option>
        <option>Hero</option>
        <option>Berserker</option>
        <option>Healer</option>
        <option>Mercenary</option>
    </select>

    <button onclick="createCharacter()">Create Character</button>
</div>

<div class="panel">
    <h2 id="charInfo">No character</h2>

    <div class="stat">Level: <span id="level">1</span></div>
    <div class="stat">XP: <span id="xp">0</span></div>

    <div class="stat">Gold: <span id="gold">0</span></div>

    <div class="stat">Realm Rank: RR<span id="rr">1</span></div>

    <div class="stat">Realm Points: <span id="rp">0</span></div>

    <div class="stat">Loot Found: <span id="loot">0</span></div>
</div>

<div class="panel">
    <h2>Battle Log</h2>
    <div class="log" id="log"></div>
</div>

<script>

let player = {
    name:"",
    realm:"",
    cls:"",
    level:1,
    xp:0,
    gold:0,
    rp:0,
    loot:0
};

function addLog(text){

    const log=document.getElementById("log");

    log.innerHTML =
        "["+new Date().toLocaleTimeString()+"] "
        + text + "<br>" + log.innerHTML;
}

function createCharacter(){

    player.name=document.getElementById("name").value;

    player.realm=document.getElementById("realm").value;

    player.cls=document.getElementById("class").value;

    addLog(
      player.name +
      " entered " +
      player.realm +
      " as a " +
      player.cls
    );

    updateUI();
}

function levelRequirement(){
    return player.level * 100;
}

function updateUI(){

    document.getElementById("charInfo").innerText =
    player.name +
    " - " +
    player.realm +
    " " +
    player.cls;

    document.getElementById("level").innerText =
    player.level;

    document.getElementById("xp").innerText =
    player.xp + "/" + levelRequirement();

    document.getElementById("gold").innerText =
    player.gold;

    document.getElementById("rp").innerText =
    player.rp;

    document.getElementById("loot").innerText =
    player.loot;

    document.getElementById("rr").innerText =
    Math.floor(player.rp / 1000) + 1;
}

function xpTick(){

    if(!player.name) return;

    player.xp += 5;
    player.gold += 2;

    if(player.xp >= levelRequirement()){

        player.xp=0;
        player.level++;

        addLog(
          player.name +
          " reached level " +
          player.level
        );
    }

    updateUI();
}

function rvrBattle(){

    if(!player.name) return;

    let win = Math.random() > 0.4;

    if(win){

        let rpGain =
            Math.floor(Math.random()*50)+25;

        player.rp += rpGain;

        addLog(
          "Victory! +" +
          rpGain +
          " Realm Points"
        );

    }else{

        addLog(
          "Defeat in frontier skirmish."
        );
    }

    if(Math.random() > 0.7){

        player.loot++;

        addLog(
          "Loot Found: Frontier Token"
        );
    }

    updateUI();
}

function saveGame(){

    localStorage.setItem(
      "idleEdenSave",
      JSON.stringify(player)
    );
}

function loadGame(){

    let save=
    localStorage.getItem("idleEdenSave");

    if(save){

        player=
        JSON.parse(save);

        updateUI();

        addLog("Game loaded.");
    }
}

setInterval(xpTick,1000);
setInterval(rvrBattle,10000);
setInterval(saveGame,5000);

loadGame();

</script>

</body>
</html>
