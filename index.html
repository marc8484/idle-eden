<!DOCTYPE html><html><head><meta charset="utf-8"><title>Idle Eden V3.1</title><style>body{background:#1b1b1b;color:white;font-family:Arial;max-width:1200px;margin:auto;padding:20px}.panel{background:#2d2d2d;padding:12px;border-radius:8px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.keep{padding:6px;background:#444;margin:4px 0}button,input,select{padding:6px;margin:2px}.log{height:180px;overflow:auto;background:black;padding:8px}</style></head><body><h1>Idle Eden V3.1</h1><div class="panel"><input id="charName" placeholder="Character Name"><select id="realm"><option>Hibernia</option><option>Midgard</option><option>Albion</option></select><select id="clazz"><option>Chanter</option><option>Hero</option><option>Druid</option><option>Berserker</option></select><button onclick="createChar()">Create Character</button></div><div class="grid"><div class="panel"><h3>Characters</h3><div id="chars"></div></div><div class="panel"><h3>Realm War</h3><div id="keeps"></div></div></div><div id="game" style="display:none"><div class="grid"><div class="panel"><h2 id="header"></h2><div>Level: <span id="level"></span></div><div>Gold: <span id="gold"></span></div><div>RP: <span id="rp"></span></div><div>Power: <span id="power"></span></div></div><div class="panel"><h3>Equipment</h3><div>Weapon: <span id="weapon"></span></div><div>Helm: <span id="helm"></span></div><div>Chest: <span id="chest"></span></div><div>Ring: <span id="ring"></span></div><div>Cloak: <span id="cloak"></span></div></div></div><div class="panel"><h3>Inventory</h3><div id="inv"></div></div><div class="panel"><h3>Battle Log</h3><div class="log" id="log"></div></div></div><script>let keeps=[{n:'Dun Crauchon',o:'Hibernia'},{n:'Dun Bolg',o:'Hibernia'},{n:'Castle Sauvage',o:'Albion'},{n:'Svasud Faste',o:'Midgard'}];let chars=JSON.parse(localStorage.getItem('idleEden31'))||[];let current=null;function save(){localStorage.setItem('idleEden31',JSON.stringify(chars));}function createChar(){let n=charName.value;if(!n)return;chars.push({id:Date.now(),name:n,realm:realm.value,clazz:clazz.value,level:1,gold:0,rp:0,power:1,inventory:[],equip:{weapon:null,helm:null,chest:null,ring:null,cloak:null}});save();renderChars();}function renderChars(){chars.innerHTML='';document.getElementById('chars').innerHTML='';charsData=chars;charsData.forEach(c=>document.getElementById('chars').innerHTML+=`<div><b>${c.name}</b> <button onclick="play(${c.id})">Play</button></div>`);}function renderKeeps(){document.getElementById('keeps').innerHTML='';keeps.forEach(k=>document.getElementById('keeps').innerHTML+=`<div class="keep">${k.n}: ${k.o}</div>`);}window.play=id=>{current=chars.find(x=>x.id===id);game.style.display='block';update();};function update(){if(!current)return;header.innerText=current.name+' '+current.realm;level.innerText=current.level;gold.innerText=current.gold;rp.innerText=current.rp;power.innerText=current.power;['weapon','helm','chest','ring','cloak'].forEach(s=>document.getElementById(s).innerText=current.equip[s]?.name||'None');inv.innerHTML='';current.inventory.forEach(i=>inv.innerHTML+=`<div>${i.name} +${i.power}</div>`);save();}function logmsg(t){log.innerHTML=t+'<br>'+log.innerHTML;}function loot(){let slots=['weapon','helm','chest','ring','cloak'];let names=['Frontier','Relic','Hero','Celtic'];let item={slot:slots[Math.floor(Math.random()*slots.length)],name:names[Math.floor(Math.random()*names.length)]+' '+slots[Math.floor(Math.random()*slots.length)],power:Math.floor(Math.random()*10)+1};current.inventory.push(item);if(!current.equip[item.slot]||item.power>(current.equip[item.slot].power||0)){current.equip[item.slot]=item;current.power+=1;}logmsg('Loot '+item.name);}function tick(){if(!current)return;current.gold+=5;current.rp+=10;if(Math.random()>.8)loot();if(current.rp>current.level*100){current.level++;logmsg('Level Up');}update();}function warTick(){let realms=['Albion','Midgard','Hibernia'];let k=keeps[Math.floor(Math.random()*keeps.length)];k.o=realms[Math.floor(Math.random()*3)];renderKeeps();if(current&&k.o===current.realm)current.rp+=25;}renderChars();renderKeeps();setInterval(tick,5000);setInterval(warTick,30000);</script></body></html>
